  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    labels:
      - 'automerge'

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      # CodeQL steps must all run the same version, so they have to be bumped together
      codeql-action:
        patterns:
          - 'github/codeql-action*'
